[package]
name = "ott-nts3-plug"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
web = ["dep:nts3-rs-wasm"]

[dependencies]
nts3 = { path = "../../crates/nts3" }
nts3-rs-wasm = { path = "../../crates/nts3-rs-wasm", optional = true }
libm = "0.2.15"

[lib]
name = "ott_nts3"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]
