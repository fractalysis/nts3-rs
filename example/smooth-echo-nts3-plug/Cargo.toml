[package]
name = "smooth-echo-nts3-plug"
version = "0.1.0"
edition = "2024"
authors = ["Fraccy (ssh)"]
publish = false

[dependencies]
# This is the public facade planned in plan/architecture.md. It does not exist yet.
nts3 = { path = "../../crates/nts3" }

# 0.21.0 is pinned because its no_std build was verified for
# thumbv7em-none-eabihf. FunDSP 0.22/0.23 currently need small no_std fixes.
fundsp = { version = "=0.21.0", default-features = false }

[lib]
path = "src/lib.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
